{% extends 'base.html' %}

{% block title %}{% if refeicao %}Editar Refeição{% else %}Nova Refeição{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="card-title mb-0">
                    {% if refeicao %}Editar Refeição{% else %}Nova Refeição para {{ restaurante.nome }}{% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do Prato/Lanche *</label>
                        <input type="text" class="form-control" id="nome" name="nome" value="{{ refeicao.nome if refeicao else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3" placeholder="Ingredientes, tamanho, etc.">{{ refeicao.descricao if refeicao else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="preco" class="form-label">Preço (R$) *</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="preco" name="preco" value="{{ refeicao.preco if refeicao else '0.00' }}" required>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('refeicoes.listar_por_restaurante', restaurante_id=restaurante.id) }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">
                            {% if refeicao %}Salvar Alterações{% else %}Cadastrar Refeição{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
