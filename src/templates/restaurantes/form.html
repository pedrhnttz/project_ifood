{% extends 'base.html' %}

{% block title %}{% if restaurante %}Editar Restaurante{% else %}Novo Restaurante{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="card-title mb-0">
                    {% if restaurante %}Editar Restaurante #{{ restaurante.id }}{% else %}Cadastrar Novo Restaurante{% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do Restaurante *</label>
                        <input type="text" class="form-control" id="nome" name="nome" value="{{ restaurante.nome if restaurante else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoria *</label>
                        <input type="text" class="form-control" id="categoria" name="categoria" placeholder="Ex: Pizzaria, Japonesa, Hambúrguer" value="{{ restaurante.categoria if restaurante else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="endereco" class="form-label">Endereço Completo *</label>
                        <input type="text" class="form-control" id="endereco" name="endereco" value="{{ restaurante.endereco if restaurante else '' }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="text" class="form-control" id="telefone" name="telefone" placeholder="(00) 00000-0000" value="{{ restaurante.telefone if restaurante else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="taxa_entrega" class="form-label">Taxa de Entrega (R$) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="taxa_entrega" name="taxa_entrega" value="{{ restaurante.taxa_entrega if restaurante else '0.00' }}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('restaurantes.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">
                            {% if restaurante %}Salvar Alterações{% else %}Cadastrar Restaurante{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
